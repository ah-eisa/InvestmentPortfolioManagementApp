name: Build Android APK

on:
  push:
    branches: [capital-trader-mobile]
    paths:
      - source.zip
      - .github/workflows/build-android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack source
        run: |
          rm -rf src
          mkdir src
          unzip -q source.zip -d src

      - name: Build debug APK
        working-directory: src
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare install site
        run: |
          mkdir -p site
          cp -r src/web/* site/
          cp src/app/build/outputs/apk/debug/app-debug.apk site/Capital-AI-Trader-v0.1.0.apk
          sha256sum site/Capital-AI-Trader-v0.1.0.apk > site/Capital-AI-Trader-v0.1.0.apk.sha256

      - name: Publish generated APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -m "Build Android APK"
            git push origin HEAD:capital-trader-mobile
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: capital-ai-trader-apk
          path: site/Capital-AI-Trader-v0.1.0.apk
          if-no-files-found: error
